<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tìm Điểm Khác Biệt — OhM!nd Lab</title>
<link rel="icon" type="image/png" href="../pic/Favicon1.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
/* ── SPOT DIFFERENCE SPECIFIC ─────────────────────────────────── */

.sd-stage{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.sd-panel{flex:1;min-width:260px;max-width:480px;}
.sd-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:6px;}
.sd-imgwrap{position:relative;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg2);min-height:160px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:crosshair;user-select:none;}
.sd-imgwrap img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;}
.sd-empty{font-size:12px;color:var(--t3);padding:24px;text-align:center;}
.sd-markers{position:absolute;inset:0;pointer-events:none;}

.sd-marker{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(45,164,78,.18);border:2px solid var(--green);color:var(--green);font-family:var(--mono);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);animation:sdPop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes sdPop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

.sd-miss{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(224,62,62,.15);border:2px solid var(--red);color:var(--red);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);animation:sdMiss .6s ease forwards;}
@keyframes sdMiss{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

.sd-progress{flex:1;min-width:100px;}
.sd-prog-lbl{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px;}
.sd-prog-track{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;}
.sd-prog-fill{height:100%;background:var(--green);border-radius:999px;transition:width .35s ease;}

@media(max-width:640px){
  .sd-stage{flex-direction:column;}
  .sd-panel{max-width:none;}
}
</style>
</head>
<body>
<div id="app">

<!-- RESULT MODAL (hoàn thành) -->
<div class="overlay hidden" id="rModal">
  <div class="modal" style="text-align:center">
    <div class="modal-icon">🎉</div>
    <h2>Xuất sắc!</h2>
    <p>Bạn đã tìm đủ 10 điểm khác biệt.</p>
    <div id="rDetails" style="margin-bottom:20px;text-align:left"></div>
    <div style="display:flex;gap:9px;justify-content:center">
      <button class="btn btn-primary" id="rSaveBtn" onclick="submitScore()">Lưu điểm</button>
      <button class="btn btn-secondary" onclick="hideModal('rModal')">Đóng</button>
    </div>
  </div>
</div>

<!-- TIMEOUT MODAL (hết giờ) -->
<div class="overlay hidden" id="toModal">
  <div class="modal" style="text-align:center">
    <div class="modal-icon">⏰</div>
    <h2>Hết giờ!</h2>
    <p id="toSub">Bạn chưa tìm đủ 10 điểm khác biệt.</p>
    <div style="display:flex;gap:9px;justify-content:center">
      <button class="btn btn-primary" onclick="hideModal('toModal');retryGame()">🔁 Thử lại</button>
      <button class="btn btn-secondary" onclick="hideModal('toModal');backToList()">← Danh sách</button>
    </div>
  </div>
</div>

<header>
  <div class="logo">
    <img src="../pic/OhM!nd Lab.png" style="height:80px;object-fit:contain">
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="../index.html" class="btn btn-secondary btn-sm">← Trang chủ</a>
    <div class="player-chip" id="playerChip" onclick="changePlayer()" style="display:none">
      <div class="chip-av" id="chipAv">?</div>
      <span id="hName">Khách</span>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('play',this)">🔍 Chơi ngay</button>
  <button class="tab" onclick="switchTab('lb',this);loadLB()">🏆 Xếp hạng</button>
</div>

<div class="main">

  <!-- PLAY PAGE -->
  <div id="page-play" class="page active">
    <div id="listView">
      <div class="card-label" style="margin-bottom:14px">Chọn thử thách để bắt đầu</div>
      <div id="challengeList"><div style="text-align:center;padding:48px;color:var(--t3)">⏳ Đang tải...</div></div>
    </div>
    <div id="gameView" style="display:none">
      <div class="game-header">
        <button class="back-btn" onclick="backToList()">← Danh sách</button>
        <div>
          <div class="game-title" id="gameTitle">Tìm Điểm Khác Biệt</div>
          <div class="game-subtitle" id="gameSubtitle"></div>
        </div>
      </div>
      <div id="gameArea"></div>
    </div>
  </div>

  <!-- LEADERBOARD PAGE -->
  <div id="page-lb" class="page">
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:130px;margin-bottom:0;text-align:center;padding:16px">
        <div style="font-family:var(--mono);font-size:26px;font-weight:500;color:var(--orange)" id="lbTotal">—</div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px">Tổng lượt chơi</div>
      </div>
      <div class="card" style="flex:1;min-width:130px;margin-bottom:0;text-align:center;padding:16px">
        <div style="font-family:var(--mono);font-size:26px;font-weight:500;color:var(--orange)" id="lbPlayers">—</div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px">Số người chơi</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)">Chọn ván:</div>
        <select id="lbFilter" onchange="renderLB()" style="flex:1;min-width:200px;max-width:400px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;font-family:var(--sans);font-size:13px;font-weight:600">
          <option value="all">Tất cả ván</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadLB()">🔄 Refresh</button>
      </div>
    </div>
    <div id="lbContent"><div style="text-align:center;padding:40px;color:var(--t3)">Đang tải...</div></div>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const _cfg = 'https://script.google.com/macros/s/AKfycby2iK5X78FucVv36FcgyKPJiEopb9gdQMpD6V11QWAnMYpNo09yetHe11V3TtNjvbwG/exec';
const _key = 'BTK2026';

// ── STATE ───────────────────────────────────────────────────
let playerName = localStorage.getItem('bb_name') || '';
let playerDept = localStorage.getItem('bb_dept') || '';
let challenges = [];
let playedChallenges = JSON.parse(localStorage.getItem('bb_spot_played') || '{}');
let G = {};
let _allScores = [], _allGroups = {};

// ── BOOT ────────────────────────────────────────────────────
window.onload = () => {
  if(!playerName){ window.location.href='../index.html'; return; }
  updateHeader();
  fetchChallenges();
};

// ── PLAYER ──────────────────────────────────────────────────
function showModal(id){ document.getElementById(id).classList.remove('hidden'); }
function hideModal(id){ document.getElementById(id).classList.add('hidden'); }
function changePlayer(){ window.location.href = '../index.html'; }
function updateHeader(){
  document.getElementById('hName').textContent = playerName||'Khách';
  document.getElementById('chipAv').textContent = (playerName||'?')[0].toUpperCase();
  document.getElementById('playerChip').style.display = 'flex';
}

// ── TABS ────────────────────────────────────────────────────
function switchTab(name, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='play') backToList();
}

// ── FETCH CHALLENGES ────────────────────────────────────────
async function fetchChallenges(){
  try{
    const res = await fetch(`${_cfg}?action=getActiveChallenges&key=${_key}&_=${Date.now()}`);
    const data = await res.json();
    challenges = (data.challenges||[]).filter(c => c.type === 'spot-difference');
    renderChallengeList();
  }catch(e){
    document.getElementById('challengeList').innerHTML=`<div class="no-challenges"><div class="icon">⚠️</div><h3>Không thể tải</h3><p>${e.message}</p></div>`;
  }
}

function renderChallengeList(){
  const list = document.getElementById('challengeList');
  const now = Date.now();
  const active = challenges.filter(c => new Date(c.deadline) > now);
  if(!active.length){
    list.innerHTML=`<div class="no-challenges"><div class="icon">🔍</div><h3>Chưa có thử thách nào</h3><p>Admin sẽ tạo thử thách mới sớm thôi!</p></div>`;
    return;
  }
  list.innerHTML='';
  const grid = document.createElement('div'); grid.className='ch-grid';
  active.forEach(ch => {
    const played = playedChallenges[ch.id];
    const tl = ch.timeLimit||180;
    const card = document.createElement('div');
    card.className='ch-card'+(played?' played':'');
    card.innerHTML=`
      <div class="ch-card-top">
        <span class="ch-diff diff-medium">🔍 Tìm khác biệt</span>
      </div>
      <div class="ch-title">${escH(ch.title)}</div>
      <div class="ch-desc">${escH(ch.description||'Tìm 10 điểm khác biệt giữa 2 hình ảnh!')}</div>
      <div class="ch-meta">
        <span class="ch-meta-item">⏱ ${formatTime(tl)}</span>
        <span class="ch-meta-item">⏰ <span class="ch-countdown" id="cd-${ch.id}"></span></span>
      </div>
      ${played?`<div class="ch-played-badge">✅ Đã chơi — ${formatTime(played.time)}</div>`:''}`;
    card.onclick = () => startGame(ch);
    grid.appendChild(card);
    startCardCountdown(ch.id, new Date(ch.deadline));
  });
  list.appendChild(grid);
}

function startCardCountdown(id, deadline){
  const update = () => {
    const el = document.getElementById('cd-'+id); if(!el) return;
    const diff = deadline - Date.now();
    if(diff<=0){ el.textContent='Hết hạn'; return; }
    const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.className='ch-countdown'+(diff<3600000?' urgent':'');
  };
  update(); setInterval(update,1000);
}

// ══════════════════════════════════════════════════════════════
//  GAME ENGINE
// ══════════════════════════════════════════════════════════════
const TOTAL_SPOTS = 10;
const HIT_TOLERANCE = 0.045; // % của (rộng+cao)/2 ảnh hiển thị

function startGame(ch){
  document.getElementById('listView').style.display='none';
  document.getElementById('gameView').style.display='block';
  document.getElementById('gameTitle').textContent = ch.title;
  document.getElementById('gameSubtitle').textContent = `Tìm ${TOTAL_SPOTS} điểm khác biệt · ${formatTime(ch.timeLimit||180)}`;

  G = {
    ch,
    found: new Set(),
    errors: 0,
    timeLimit: ch.timeLimit||180,
    timeLeft: ch.timeLimit||180,
    interval: null,
    done: false
  };

  renderGame();
  startTimer();
}

function retryGame(){ startGame(G.ch); }

function renderGame(){
  const ch = G.ch;
  const played = playedChallenges[ch.id];
  const imgL = toDriveImg(ch.imgOriginal);
  const imgR = toDriveImg(ch.imgModified);

  document.getElementById('gameArea').innerHTML = `
    ${played?`<div class="already-played">✅ Đã hoàn thành với <strong>${formatTime(played.time)}</strong>. Chơi lại không tính điểm.</div>`:''}
    <div class="timer-bar">
      <div class="game-timer" id="sdTimer">${formatTime(G.timeLeft)}</div>
      <div class="stats-row">
        <span class="stat-chip">🎯 <span id="sdFound">0</span> / ${TOTAL_SPOTS}</span>
        <span class="stat-chip err">❌ <span id="sdErrors">0</span> nhầm</span>
      </div>
      <div class="sd-progress">
        <div class="sd-prog-lbl" id="sdProgLbl">0 / ${TOTAL_SPOTS} điểm</div>
        <div class="sd-prog-track"><div class="sd-prog-fill" id="sdProgFill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="sd-stage">
      <div class="sd-panel">
        <div class="sd-label">Ảnh gốc</div>
        <div class="sd-imgwrap" id="sd-wrap-left">
          <span class="sd-empty">⏳ Đang tải ảnh...</span>
          <img id="sd-img-left" style="display:none" draggable="false" alt="Ảnh gốc">
          <div class="sd-markers" id="sd-markers-left"></div>
        </div>
      </div>
      <div class="sd-panel">
        <div class="sd-label">Ảnh đã chỉnh — click để tìm</div>
        <div class="sd-imgwrap" id="sd-wrap-right">
          <span class="sd-empty">⏳ Đang tải ảnh...</span>
          <img id="sd-img-right" style="display:none" draggable="false" alt="Ảnh đã chỉnh">
          <div class="sd-markers" id="sd-markers-right"></div>
        </div>
      </div>
    </div>
    <div class="tips-box">💡 Click vào <strong>vị trí khác biệt</strong> ở ảnh trái hoặc ảnh phải. Tìm đủ ${TOTAL_SPOTS} điểm trước khi hết giờ!</div>`;

  setupPanel('left', imgL);
  setupPanel('right', imgR);
}

function setupPanel(side, url){
  const wrap = document.getElementById('sd-wrap-'+side);
  const img = document.getElementById('sd-img-'+side);
  img.onload = () => {
    img.style.display='block';
    const span = wrap.querySelector('.sd-empty');
    if(span) span.style.display='none';
  };
  img.onerror = () => {
    const span = wrap.querySelector('.sd-empty');
    if(span) span.textContent='❌ Không tải được ảnh';
  };
  img.src = url || '';
  wrap.onclick = (e) => handleClick(side, e);
}

function startTimer(){
  if(G.interval) clearInterval(G.interval);
  G.interval = setInterval(()=>{
    if(G.done) return;
    G.timeLeft--;
    const el = document.getElementById('sdTimer');
    if(el) el.textContent = formatTime(Math.max(0,G.timeLeft));
    if(G.timeLeft<=0){ handleTimeout(); }
  }, 1000);
}

function handleClick(side, e){
  if(G.done) return;
  const img = document.getElementById('sd-img-'+side);
  if(!img || img.style.display==='none') return;
  const rect = img.getBoundingClientRect();
  const pctX = (e.clientX - rect.left) / rect.width;
  const pctY = (e.clientY - rect.top) / rect.height;
  if(pctX<0||pctX>1||pctY<0||pctY>1) return;

  const spots = G.ch.spots||[];
  const tolerance = ((rect.width+rect.height)/2) * HIT_TOLERANCE;
  const xKey = side==='left' ? 'leftX' : 'rightX';
  const yKey = side==='left' ? 'leftY' : 'rightY';

  let hitIdx = -1, hitDist = Infinity;
  spots.forEach((s,i) => {
    const dx = (pctX - s[xKey]) * rect.width;
    const dy = (pctY - s[yKey]) * rect.height;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist <= tolerance && dist < hitDist){ hitDist = dist; hitIdx = i; }
  });

  if(hitIdx === -1){
    // Miss — không trúng điểm khác biệt nào
    G.errors++;
    document.getElementById('sdErrors').textContent = G.errors;
    showMiss(side, pctX, pctY);
    return;
  }
  if(G.found.has(hitIdx)){
    // Điểm đã tìm rồi, click lại không tính lỗi
    return;
  }

  G.found.add(hitIdx);
  markFound(hitIdx, spots[hitIdx]);
  document.getElementById('sdFound').textContent = G.found.size;
  document.getElementById('sdProgLbl').textContent = `${G.found.size} / ${TOTAL_SPOTS} điểm`;
  document.getElementById('sdProgFill').style.width = (G.found.size/TOTAL_SPOTS*100)+'%';

  if(G.found.size >= TOTAL_SPOTS){
    setTimeout(()=>endGame(), 300);
  }
}

function markFound(idx, spot){
  ['left','right'].forEach(side => {
    const holder = document.getElementById('sd-markers-'+side);
    if(!holder) return;
    const x = (side==='left' ? spot.leftX : spot.rightX)*100;
    const y = (side==='left' ? spot.leftY : spot.rightY)*100;
    const m = document.createElement('div');
    m.className = 'sd-marker';
    m.style.left = x+'%';
    m.style.top = y+'%';
    m.textContent = idx+1;
    holder.appendChild(m);
  });
}

function showMiss(side, pctX, pctY){
  const holder = document.getElementById('sd-markers-'+side);
  if(!holder) return;
  const m = document.createElement('div');
  m.className = 'sd-miss';
  m.style.left = (pctX*100)+'%';
  m.style.top = (pctY*100)+'%';
  m.textContent = '✕';
  holder.appendChild(m);
  setTimeout(()=>m.remove(), 600);
}

function handleTimeout(){
  if(G.done) return;
  G.done = true;
  clearInterval(G.interval);
  document.getElementById('toSub').textContent = `Bạn tìm được ${G.found.size} / ${TOTAL_SPOTS} điểm khác biệt.`;
  showModal('toModal');
}

function endGame(){
  G.done = true;
  clearInterval(G.interval);
  const elapsed = G.timeLimit - G.timeLeft;
  document.getElementById('rDetails').innerHTML = `
    <div class="result-row"><span>⏱ Thời gian</span><span class="result-val">${formatTime(elapsed)}</span></div>
    <div class="result-row"><span>❌ Số lần nhầm</span><span class="result-val">${G.errors}</span></div>
    <div class="result-row"><span>🎯 Tìm đúng</span><span class="result-val">${TOTAL_SPOTS} / ${TOTAL_SPOTS}</span></div>
    <div class="result-row"><span>👤 Người chơi</span><span class="result-val">${escH(playerName)}</span></div>`;
  document.getElementById('rSaveBtn').textContent = 'Lưu điểm';
  showModal('rModal');
}

// ── SUBMIT SCORE ────────────────────────────────────────────
async function submitScore(){
  const btn = document.getElementById('rSaveBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  const elapsed = G.timeLimit - G.timeLeft;
  try{
    await fetch(`${_cfg}?action=addScore&key=${_key}&name=${encodeURIComponent(playerName)}&dept=${encodeURIComponent(playerDept||'')}&game=SpotDifference&title=${encodeURIComponent(G.ch.title)}&time=${elapsed}&challengeId=${G.ch.id}&errors=${G.errors}&timestamp=${encodeURIComponent(new Date().toISOString())}`);
    playedChallenges[G.ch.id] = {time: elapsed};
    localStorage.setItem('bb_spot_played', JSON.stringify(playedChallenges));
    showToast('✅ Điểm đã lưu!','ok');
  }catch(e){ showToast('❌ Lỗi kết nối','bad'); }
  btn.textContent = 'Đã lưu ✓';
  setTimeout(()=>hideModal('rModal'), 1000);
}

function backToList(){
  if(G.interval) clearInterval(G.interval);
  G = {};
  document.getElementById('gameView').style.display='none';
  document.getElementById('listView').style.display='block';
  fetchChallenges();
}

// ── LEADERBOARD ─────────────────────────────────────────────
async function loadLB(){
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t3)">Đang tải...</div>';
  try{
    const res = await fetch(`${_cfg}?action=getScores&key=${_key}&challengeId=all&_=${Date.now()}`);
    const data = await res.json();
    _allScores = (data.scores||[]).filter(s => s.game==='SpotDifference');
    document.getElementById('lbTotal').textContent = _allScores.length;
    document.getElementById('lbPlayers').textContent = new Set(_allScores.map(s=>s.name)).size;
    _allGroups = {};
    _allScores.forEach(s=>{
      const cid = String(s.challengeId||'?');
      if(!_allGroups[cid]) _allGroups[cid]=[];
      _allGroups[cid].push(s);
    });
    const sel = document.getElementById('lbFilter');
    while(sel.options.length>1) sel.remove(1);
    Object.keys(_allGroups).sort((a,b)=>+b-+a).forEach(cid=>{
      const ch = challenges.find(c=>String(c.id)===cid);
      const opt = document.createElement('option');
      opt.value=cid; opt.textContent=ch?.title||`Ván #${cid}`;
      sel.appendChild(opt);
    });
    renderLB();
  }catch(e){
    content.innerHTML=`<div style="text-align:center;padding:40px;color:var(--t3)">❌ ${e.message}</div>`;
  }
}

function renderLB(){
  const content = document.getElementById('lbContent');
  if(!_allScores.length){
    content.innerHTML='<div style="text-align:center;padding:48px;color:var(--t3)">🚀 Chưa có ai hoàn thành!</div>';
    return;
  }
  const filter = document.getElementById('lbFilter')?.value||'all';
  const ri = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':`<span style="font-family:var(--mono);color:var(--t3)">#${i+1}</span>`;

  const renderTable = rows => {
    const sorted = [...rows].sort((a,b)=>((+a.time||0)-(+b.time||0)) || ((+a.errors||0)-(+b.errors||0)));
    return `<table style="width:100%;border-collapse:collapse">
      <thead><tr>
        ${['Hạng','Tên','Phòng ban','Thời gian','Số lần nhầm'].map(h=>`<th style="text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1.5px solid var(--border);font-weight:700">${h}</th>`).join('')}
      </tr></thead>
      <tbody>${sorted.map((s,i)=>`<tr style="background:${s.name===playerName?'var(--ol)':''}">
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2)">${ri(i)}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);font-weight:700;color:${s.name===playerName?'var(--orange)':'var(--text)'}">
          ${escH(s.name)}${s.name===playerName?'<span style="font-size:10px;background:var(--ol);color:var(--orange);border:1px solid var(--om);border-radius:999px;padding:1px 6px;margin-left:4px">bạn</span>':''}
        </td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);color:var(--t2);font-size:13px">${escH(s.dept||'—')}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);font-family:var(--mono);color:var(--orange);font-weight:700;font-size:15px">${formatTime(+s.time)}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);color:var(--t2);font-weight:600">${s.errors||0}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  };

  if(filter==='all'){
    const cids = Object.keys(_allGroups).sort((a,b)=>+b-+a);
    content.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:16px">
      ${cids.map(cid=>{
        const ch=challenges.find(c=>String(c.id)===cid);
        const title=ch?.title||_allGroups[cid][0]?.title||`Ván #${cid}`;
        return `<div style="flex:1;min-width:320px;background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)">
          <div style="font-size:15px;font-weight:800;margin-bottom:14px">${escH(title)}</div>
          ${renderTable(_allGroups[cid])}
        </div>`;
      }).join('')}
    </div>`;
  }else{
    const rows = _allGroups[filter]||[];
    content.innerHTML=`<div class="card">${renderTable(rows)}</div>`;
  }
}

// ── HELPERS ─────────────────────────────────────────────────
// Chuyển mọi kiểu link Google Drive sang link ảnh trực tiếp
function toDriveImg(url){
  if(!url) return url;
  url = String(url).trim();
  if(/lh3\.googleusercontent\.com|drive\.google\.com\/thumbnail/.test(url)) return url;
  if(!/drive\.google\.com/.test(url)) return url;
  let id = null;
  let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) id = m[1];
  if(!id){
    m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if(m) id = m[1];
  }
  if(!id) return url;
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
}

function formatTime(s){ s=Math.max(0,s|0); return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function escH(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
