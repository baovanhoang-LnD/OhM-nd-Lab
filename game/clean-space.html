<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dọn Dẹp Không Gian — OhM!nd Lab</title>
<link rel="icon" type="image/png" href="../pic/Favicon1.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
/* ── CLEAN SPACE SPECIFIC ────────────────────────────────────── */

.cs-hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow);margin-bottom:16px;}
.cs-timer{font-family:var(--mono);font-size:32px;font-weight:500;color:var(--orange);letter-spacing:2px;}
.cs-sep{width:1.5px;height:32px;background:var(--border);flex-shrink:0;}
.cs-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.cs-stat-val{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--text);}
.cs-stat-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);}
.cs-progress{flex:1;min-width:100px;}
.cs-prog-lbl{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px;}
.cs-prog-track{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;}
.cs-prog-fill{height:100%;background:var(--orange);border-radius:999px;transition:width .4s ease;}

.cs-stage-wrap{max-width:720px;margin:0 auto;}
.cs-stage{
  position:relative; width:100%; border-radius:18px; overflow:hidden;
  box-shadow:var(--shadow-lg); border:5px solid #fff; background:#eee;
  user-select:none; touch-action:none;
}
.cs-stage img.cs-bg{ display:block; width:100%; height:auto; pointer-events:none; user-select:none; }
.cs-layer{ position:absolute; inset:0; }

.cs-stain{
  position:absolute; border-radius: 50% 50% 45% 55% / 60% 55% 45% 40%;
  cursor:pointer; transition: transform .15s ease, opacity .35s ease;
  background: radial-gradient(ellipse at 40% 40%, #7a5236, #4d3320);
}
.cs-stain.cleaned{ opacity:0; transform: scale(0.3); pointer-events:none; }

.cs-item{
  position:absolute; cursor:grab; z-index:15; touch-action:none;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.18));
  display:flex; align-items:center; justify-content:center;
  font-size: 28px; line-height:1;
}
.cs-item img{ width:100%; height:100%; object-fit:contain; pointer-events:none; }
.cs-item.dragging{ cursor:grabbing; z-index:30; }
.cs-item.placed{ pointer-events:none; cursor:default; z-index:12; }

.cs-zone{
  position:absolute; border:2px dashed var(--orange); border-radius:8px;
  opacity:.55;
}

.placed-badge{
  position:absolute; top:-8px; right:-8px; width:18px; height:18px;
  background:#2da44e; border:2px solid #fff; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; color:#fff; font-weight:700;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.cs-rag{
  position:absolute; left:14px; bottom:14px; width:60px; height:40px;
  cursor:grab; z-index:20; touch-action:none;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.18));
}
.cs-rag.dragging{ cursor:grabbing; z-index: 35; }
.cs-rag svg{ width:100%; height:100%; }

.cs-trash-bin{
  position:absolute; width:56px; height:56px;
  z-index:14; pointer-events:none;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.22));
}
.cs-trash-default{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:30px; background:var(--white); border:2px solid var(--border); border-radius:50%;
}

.cs-sparkle{ position:absolute; pointer-events:none; font-size:18px; animation: csPop .5s ease forwards; z-index:40; }
@keyframes csPop{ 0%{ transform: scale(.4) translateY(0); opacity:1; } 100%{ transform: scale(1.3) translateY(-22px); opacity:0; } }

.cs-toast{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%) translateY(16px);
  background: var(--text); color:#fff; padding:9px 16px; border-radius:10px;
  font-size:12.5px; max-width:90%; text-align:center; opacity:0;
  transition:all .3s ease; pointer-events:none; line-height:1.4; z-index:50;
}
.cs-toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
.cs-toast b{ color: var(--orange); }

.cs-stage-transition{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background: rgba(250,246,238,0); pointer-events:none;
  opacity:0; transition: all .35s ease; z-index:60;
}
.cs-stage-transition.show{ background: rgba(250,246,238,0.92); opacity:1; }
.cs-stage-trans-inner{
  text-align:center; font-size:20px; font-weight:800; color:var(--text);
  transform: scale(0.85); transition: transform .35s ease;
}
.cs-stage-transition.show .cs-stage-trans-inner{ transform: scale(1); }
.cs-stage-trans-inner span{ font-size:13px; font-weight:600; color:var(--t3); display:block; margin-top:4px; }

.score-big{font-family:var(--mono);font-size:48px;font-weight:500;color:var(--orange);line-height:1;margin:10px 0 4px;}
.score-sub{font-size:13px;color:var(--t2);margin-bottom:16px;}

@media(max-width:500px){
  .cs-hud{gap:8px;padding:10px 14px;}
  .cs-timer{font-size:24px;}
}
</style>
</head>
<body>
<div id="app">

<!-- RESULT MODAL -->
<div class="overlay hidden" id="rModal">
  <div class="modal" style="text-align:center">
    <div class="modal-icon">🎉</div>
    <h2>Hoàn thành!</h2>
    <div class="score-big" id="rTime">00:00</div>
    <div class="score-sub" id="rSub"></div>
    <div id="rDetails" style="margin-bottom:20px;text-align:left"></div>
    <div style="display:flex;gap:9px;justify-content:center">
      <button class="btn btn-primary" id="rSaveBtn" onclick="submitScore()">Lưu điểm</button>
      <button class="btn btn-secondary" onclick="document.getElementById('rModal').classList.add('hidden')">Đóng</button>
    </div>
  </div>
</div>

<header>
  <div class="logo">
    <img src="../pic/OhM!nd Lab.png" style="height:80px;object-fit:contain">
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="../index.html" class="btn btn-secondary btn-sm">← Trang chủ</a>
    <div class="player-chip" id="playerChip" onclick="changePlayer()" style="display:none">
      <div class="chip-av" id="chipAv">?</div>
      <span id="hName">Khách</span>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('play',this)">🧹 Chơi ngay</button>
  <button class="tab" onclick="switchTab('lb',this);loadLB()">🏆 Xếp hạng</button>
</div>

<div class="main">

  <!-- PLAY PAGE -->
  <div id="page-play" class="page active">
    <div id="listView">
      <div class="card-label" style="margin-bottom:14px">Chọn thử thách để bắt đầu</div>
      <div id="challengeList"><div style="text-align:center;padding:48px;color:var(--t3)">⏳ Đang tải...</div></div>
    </div>
    <div id="gameView" style="display:none">
      <div class="game-header">
        <button class="back-btn" onclick="backToList()">← Danh sách</button>
        <div>
          <div class="game-title" id="gameTitle">Dọn Dẹp Không Gian</div>
          <div class="game-subtitle" id="gameSubtitle"></div>
        </div>
      </div>
      <div id="gameArea"></div>
    </div>
  </div>

  <!-- LEADERBOARD PAGE -->
  <div id="page-lb" class="page">
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:130px;margin-bottom:0;text-align:center;padding:16px">
        <div style="font-family:var(--mono);font-size:26px;font-weight:500;color:var(--orange)" id="lbTotal">—</div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px">Tổng lượt chơi</div>
      </div>
      <div class="card" style="flex:1;min-width:130px;margin-bottom:0;text-align:center;padding:16px">
        <div style="font-family:var(--mono);font-size:26px;font-weight:500;color:var(--orange)" id="lbPlayers">—</div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px">Số người chơi</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)">Chọn ván:</div>
        <select id="lbFilter" onchange="renderLB()" style="flex:1;min-width:200px;max-width:400px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;font-family:var(--sans);font-size:13px;font-weight:600">
          <option value="all">Tất cả ván</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadLB()">🔄 Refresh</button>
      </div>
    </div>
    <div id="lbContent"><div style="text-align:center;padding:40px;color:var(--t3)">Đang tải...</div></div>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const _cfg = 'https://script.google.com/macros/s/AKfycby2iK5X78FucVv36FcgyKPJiEopb9gdQMpD6V11QWAnMYpNo09yetHe11V3TtNjvbwG/exec';
const _key = 'BTK2026';

// ── STATE ───────────────────────────────────────────────────
let playerName = localStorage.getItem('bb_name') || '';
let playerDept = localStorage.getItem('bb_dept') || '';
let challenges = [];
let playedChallenges = JSON.parse(localStorage.getItem('bb_clean_played') || '{}');
let G = {};
let _allScores = [], _allGroups = {};

// ── BOOT ────────────────────────────────────────────────────
window.onload = () => {
  if(!playerName){ window.location.href='../index.html'; return; }
  updateHeader();
  fetchChallenges();
};

// ── PLAYER ──────────────────────────────────────────────────
function showModal(id){ document.getElementById(id).classList.remove('hidden'); }
function hideModal(id){ document.getElementById(id).classList.add('hidden'); }
function changePlayer(){ window.location.href = '../index.html'; }
function updateHeader(){
  document.getElementById('hName').textContent = playerName||'Khách';
  document.getElementById('chipAv').textContent = (playerName||'?')[0].toUpperCase();
  document.getElementById('playerChip').style.display = 'flex';
}

// ── TABS ────────────────────────────────────────────────────
function switchTab(name, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='play') backToList();
}

// ── FETCH CHALLENGES ────────────────────────────────────────
async function fetchChallenges(){
  try{
    const res = await fetch(`${_cfg}?action=getActiveChallenges&key=${_key}&_=${Date.now()}`);
    const data = await res.json();
    challenges = (data.challenges||[]).filter(c => c.type === 'clean-space');
    renderChallengeList();
  }catch(e){
    document.getElementById('challengeList').innerHTML=`<div class="no-challenges"><div class="icon">⚠️</div><h3>Không thể tải</h3><p>${e.message}</p></div>`;
  }
}

function renderChallengeList(){
  const list = document.getElementById('challengeList');
  const now = Date.now();
  const active = challenges.filter(c => new Date(c.deadline) > now);
  if(!active.length){
    list.innerHTML=`<div class="no-challenges"><div class="icon">🧹</div><h3>Chưa có thử thách nào</h3><p>Admin sẽ tạo thử thách mới sớm thôi!</p></div>`;
    return;
  }
  list.innerHTML='';
  const grid = document.createElement('div'); grid.className='ch-grid';
  active.forEach(ch => {
    const played = playedChallenges[ch.id];
    const stages = (ch.stages && ch.stages.length) ? ch.stages : [{tasks: ch.tasks||[]}];
    const taskCount = stages.reduce((s,st)=>s+(st.tasks?.length||0), 0);
    const stageCount = stages.length;
    const card = document.createElement('div');
    card.className='ch-card'+(played?' played':'');
    card.innerHTML=`
      <div class="ch-card-top">
        <span class="ch-diff diff-medium">🧹 Dọn dẹp</span>
      </div>
      <div class="ch-title">${escH(ch.title)}</div>
      <div class="ch-desc">${escH(ch.description||'Dọn sạch không gian bằng cách xử lý đúng từng nhiệm vụ!')}</div>
      <div class="ch-meta">
        <span class="ch-meta-item">🧽 ${stageCount>1?`${stageCount} màn · `:''}${taskCount} nhiệm vụ</span>
        <span class="ch-meta-item">⏰ <span class="ch-countdown" id="cd-${ch.id}"></span></span>
      </div>
      ${played?`<div class="ch-played-badge">✅ Đã chơi — ${formatTime(played.time)}</div>`:''}`;
    card.onclick = () => startGame(ch);
    grid.appendChild(card);
    startCardCountdown(ch.id, new Date(ch.deadline));
  });
  list.appendChild(grid);
}

function startCardCountdown(id, deadline){
  const update = () => {
    const el = document.getElementById('cd-'+id); if(!el) return;
    const diff = deadline - Date.now();
    if(diff<=0){ el.textContent='Hết hạn'; return; }
    const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.className='ch-countdown'+(diff<3600000?' urgent':'');
  };
  update(); setInterval(update,1000);
}

// ══════════════════════════════════════════════════════════════
//  GAME ENGINE — DỌN DẸP KHÔNG GIAN
//  2 loại nhiệm vụ:
//   - "wipe":  kéo khăn lau đến vết bẩn tại (x,y) để xóa tại chỗ
//   - "place": kéo vật từ (fromX,fromY) đến đúng vùng (toX,toY)
// ══════════════════════════════════════════════════════════════
function startGame(ch){
  document.getElementById('listView').style.display='none';
  document.getElementById('gameView').style.display='block';
  document.getElementById('gameTitle').textContent = ch.title;

  // Chuẩn hoá: ván cũ (1 màn, dữ liệu nằm ở gốc) → bọc thành mảng stages có 1 phần tử
  const stages = (ch.stages && ch.stages.length) ? ch.stages : [{
    background: ch.background || '',
    ragImage: ch.ragImage || '',
    ragHomeX: ch.ragHomeX ?? null,
    ragHomeY: ch.ragHomeY ?? null,
    tasks: ch.tasks || []
  }];
  const totalTasks = stages.reduce((sum,s)=>sum+(s.tasks?.length||0), 0);

  document.getElementById('gameSubtitle').textContent = stages.length>1
    ? `${stages.length} màn · ${totalTasks} nhiệm vụ`
    : `${totalTasks} nhiệm vụ`;

  G = {
    ch,
    stages,
    stageIdx: 0,
    stage: null,
    tasks: [],
    totalTasks,
    doneCount: 0,
    stageDoneCount: 0,
    misses: 0,
    timer: 0,
    interval: null,
    started: false,
    done: false
  };

  renderGame();
}

function renderGame(){
  const ch = G.ch;
  const played = playedChallenges[ch.id];

  document.getElementById('gameArea').innerHTML = `
    ${played?`<div class="already-played">✅ Đã hoàn thành với <strong>${formatTime(played.time)}</strong>. Chơi lại không tính điểm.</div>`:''}
    <div class="cs-hud">
      <div class="cs-timer" id="csTimer">00:00</div>
      <div class="cs-sep"></div>
      <div class="cs-stat">
        <div class="cs-stat-val" id="csDone">0</div>
        <div class="cs-stat-lbl">Đã xong</div>
      </div>
      ${G.stages.length>1?`<div class="cs-sep"></div>
      <div class="cs-stat">
        <div class="cs-stat-val" id="csStageLbl">1/${G.stages.length}</div>
        <div class="cs-stat-lbl">Màn</div>
      </div>`:''}
      <div class="cs-sep"></div>
      <div class="cs-progress">
        <div class="cs-prog-lbl" id="csProgLbl">0 / ${G.totalTasks} nhiệm vụ</div>
        <div class="cs-prog-track"><div class="cs-prog-fill" id="csProgFill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="cs-stage-wrap">
      <div class="cs-stage" id="csStage">
        <img class="cs-bg" id="csBg" src="" draggable="false" alt="Không gian cần dọn dẹp">
        <div class="cs-layer" id="csTasksLayer"></div>
        <div class="cs-toast" id="csToast"></div>
        <div class="cs-stage-transition" id="csStageTransition"></div>
      </div>
    </div>`;

  loadStage(0);
}

function loadStage(idx){
  G.stageIdx = idx;
  G.stage = G.stages[idx];
  G.tasks = G.stage.tasks || [];
  G.stageDoneCount = 0;

  const stageLbl = document.getElementById('csStageLbl');
  if(stageLbl) stageLbl.textContent = `${idx+1}/${G.stages.length}`;

  const bg = document.getElementById('csBg');
  bg.src = escH(G.stage.background || '');
  bg.onerror = () => { document.getElementById('csTasksLayer').innerHTML = '<p style="padding:24px;color:var(--red);text-align:center">Không tải được ảnh nền.</p>'; };
  if(bg.complete && bg.src) buildTasks(); else bg.onload = buildTasks;
}

function buildTasks(){
  const stage = document.getElementById('csStage');
  const layer = document.getElementById('csTasksLayer');
  layer.innerHTML = '';
  const oldRag = document.getElementById('csRag');
  if(oldRag) oldRag.remove();
  const oldFront = document.getElementById('csFrontOverlay');
  if(oldFront) oldFront.remove();
  const oldTrash = document.getElementById('csTrashBin');
  if(oldTrash) oldTrash.remove();
  G.itemEls = []; G.stainEls = [];

  const hasWipe = G.tasks.some(t => t.kind === 'wipe');
  const hasTrashTask = G.tasks.some(t => t.kind === 'place' && t.targetType === 'trash');

  // Icon thùng rác chung (cấp ván) — chỉ tạo nếu màn này có nhiệm vụ nhắm tới nó
  let trashEl = null;
  if(hasTrashTask){
    trashEl = document.createElement('div');
    trashEl.className = 'cs-trash-bin'; trashEl.id = 'csTrashBin';
    trashEl.innerHTML = G.ch.trashImage
      ? `<img src="${escH(G.ch.trashImage)}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none" draggable="false">`
      : `<div class="cs-trash-default">🗑️</div>`;
    stage.appendChild(trashEl);
    positionTrashBin(trashEl, stage);
  }

  G.tasks.forEach((t, idx) => {
    const sizePct = t.sizePct || 8;
    if(t.kind === 'wipe'){
      const el = document.createElement('div');
      el.className = 'cs-stain';
      el.dataset.idx = idx;
      el.style.left = (t.x*100) + '%';
      el.style.top = (t.y*100) + '%';
      el.style.width = sizePct + '%';
      el.style.transform = 'translate(-50%,-50%)';
      if(t.image){
        el.style.aspectRatio = '1';
        el.style.background = 'none';
        el.innerHTML = `<img src="${escH(t.image)}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none" draggable="false">`;
      } else {
        el.style.aspectRatio = '1.5';
      }
      layer.appendChild(el);
      G.stainEls.push(el);
    } else if(t.kind === 'place'){
      const isTrashTarget = t.targetType === 'trash';

      // Vùng đích: nếu nhắm vào thùng rác chung thì dùng luôn icon thùng rác làm đích,
      // không vẽ ô vuông đứt nét riêng trên ảnh nữa.
      let zone;
      if(isTrashTarget){
        zone = trashEl;
      } else {
        zone = document.createElement('div');
        zone.className = 'cs-zone';
        zone.dataset.idx = idx;
        zone.style.left = (t.toX*100) + '%';
        zone.style.top = (t.toY*100) + '%';
        zone.style.width = sizePct + '%';
        zone.style.aspectRatio = '1';
        zone.style.transform = 'translate(-50%,-50%)';
        layer.appendChild(zone);
      }

      // Vật thể kéo được
      const item = document.createElement('div');
      item.className = 'cs-item';
      item.dataset.idx = idx;
      item.style.left = (t.fromX*100) + '%';
      item.style.top = (t.fromY*100) + '%';
      item.style.width = sizePct + '%';
      item.style.aspectRatio = '1';
      item.style.transform = 'translate(-50%,-50%)';
      item.innerHTML = t.image ? `<img src="${escH(t.image)}" draggable="false">` : (t.icon || '📦');
      layer.appendChild(item);
      G.itemEls.push(item);

      item.addEventListener('mousedown', e => itemStart(item, zone, t, e.clientX, e.clientY));
      item.addEventListener('touchstart', e => { const tt=e.touches[0]; itemStart(item, zone, t, tt.clientX, tt.clientY); }, {passive:true});
    }
  });

  // Lớp phủ trước (che vật thể) — nằm TRÊN vật thể kéo-thả nhưng DƯỚI khăn lau
  if(G.stage.frontOverlay){
    const front = document.createElement('img');
    front.id = 'csFrontOverlay';
    front.src = G.stage.frontOverlay;
    front.draggable = false;
    front.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none;z-index:8';
    stage.appendChild(front);
  }

  if(hasWipe){
    const rag = document.createElement('div');
    rag.className = 'cs-rag'; rag.id = 'csRag';
    rag.innerHTML = G.stage.ragImage
      ? `<img src="${escH(G.stage.ragImage)}" style="width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none" draggable="false">`
      : `<svg viewBox="0 0 100 70">
      <rect x="6" y="6" width="88" height="58" rx="10" fill="#f2f0e6" stroke="#d8d2c0" stroke-width="3"/>
      <path d="M6 20 H94" stroke="#d8d2c0" stroke-width="3"/><path d="M6 46 H94" stroke="#d8d2c0" stroke-width="3"/>
      <rect x="6" y="6" width="88" height="14" rx="6" fill="#f46b1b" opacity="0.5"/></svg>`;
    stage.appendChild(rag);
    setupRag(rag, stage);
  }

  attachStainClick();
}

// ── WIPE TASK (khăn lau) ──────────────────────────────────────
function positionTrashBin(el, stage){
  const sr = stage.getBoundingClientRect();
  const ew = el.offsetWidth || 56, eh = el.offsetHeight || 56;
  if(G.ch.trashX!=null && G.ch.trashY!=null){
    el.style.left = Math.round(G.ch.trashX*sr.width - ew/2) + 'px';
    el.style.top  = Math.round(G.ch.trashY*sr.height - eh/2) + 'px';
  } else {
    // Mặc định: góc dưới phải
    el.style.right = '14px';
    el.style.bottom = '14px';
  }
}

function getRagHomePos(rag, stage){
  const sr = stage.getBoundingClientRect();
  const rw = rag.offsetWidth || 60, rh = rag.offsetHeight || 40;
  if(G.stage.ragHomeX!=null && G.stage.ragHomeY!=null){
    return {
      left: Math.round(G.stage.ragHomeX*sr.width - rw/2) + 'px',
      top : Math.round(G.stage.ragHomeY*sr.height - rh/2) + 'px'
    };
  }
  // Mặc định: góc dưới trái (giữ hành vi cũ nếu admin không đặt vị trí riêng)
  return { left: '14px', top: Math.round(sr.height - rh - 14) + 'px' };
}

function setupRag(rag, stage){
  let dragging=false, offX=0, offY=0;

  // Đặt vị trí gốc ban đầu
  const home = getRagHomePos(rag, stage);
  rag.style.left = home.left; rag.style.top = home.top; rag.style.bottom = 'auto';

  function start(cx,cy){
    dragging=true; rag.classList.add('dragging');
    const r=rag.getBoundingClientRect();
    offX=cx-r.left; offY=cy-r.top;
    rag.style.right='auto'; rag.style.bottom='auto';
  }
  function move(cx,cy){
    if(!dragging) return;
    const sr=stage.getBoundingClientRect();
    rag.style.left=(cx-offX-sr.left)+'px'; rag.style.top=(cy-offY-sr.top)+'px';
    G.stainEls.forEach(s=>{
      if(s.classList.contains('cleaned')) return;
      const r=s.getBoundingClientRect();
      const hit = cx>r.left-10 && cx<r.right+10 && cy>r.top-10 && cy<r.bottom+10;
      s.style.filter = hit ? 'brightness(1.3)' : '';
    });
  }
  function end(cx,cy){
    if(!dragging) return;
    dragging=false; rag.classList.remove('dragging');
    let hit=null;
    G.stainEls.forEach(s=>{
      if(s.classList.contains('cleaned')) return;
      const r=s.getBoundingClientRect();
      const isHit = cx>r.left-14 && cx<r.right+14 && cy>r.top-14 && cy<r.bottom+14;
      if(isHit) hit=s; s.style.filter='';
    });
    if(hit) onWipeSuccess(hit);
    const homePos = getRagHomePos(rag, stage);
    rag.style.left = homePos.left; rag.style.top = homePos.top;
  }

  rag.addEventListener('mousedown', e=>start(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup', e=>end(e.clientX,e.clientY));
  rag.addEventListener('touchstart', e=>{const t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  window.addEventListener('touchmove', e=>{if(!dragging)return;const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  window.addEventListener('touchend', e=>{const t=e.changedTouches[0];end(t.clientX,t.clientY);});
}

function attachStainClick(){ /* click handled via rag drag; giữ chỗ nếu cần mở rộng */ }

function onWipeSuccess(stainEl){
  stainEl.classList.add('cleaned');
  const idx = +stainEl.dataset.idx;
  const t = G.tasks[idx];
  ensureTimerStarted();
  spawnSparkle(stainEl);
  showCsToast(t.noiquy);
  markTaskDone();
}

// ── PLACE TASK (đặt đồ đúng chỗ) ──────────────────────────────
let activeItem=null, activeZone=null, activeTask=null, itemOffX=0, itemOffY=0, itemHome=null;

function itemStart(item, zone, task, cx, cy){
  if(item.classList.contains('placed')) return;
  ensureTimerStarted();
  activeItem=item; activeZone=zone; activeTask=task;
  item.classList.add('dragging');
  itemHome = { left:item.style.left, top:item.style.top, transform:item.style.transform };
  const r=item.getBoundingClientRect();
  itemOffX=cx-r.left; itemOffY=cy-r.top;
  item.style.transform='none';
}
function itemMove(cx,cy){
  if(!activeItem) return;
  const stage=document.getElementById('csStage');
  const sr=stage.getBoundingClientRect();
  activeItem.style.left=(cx-itemOffX-sr.left)+'px';
  activeItem.style.top=(cy-itemOffY-sr.top)+'px';
  const zr=activeZone.getBoundingClientRect();
  const hit = cx>zr.left-8 && cx<zr.right+8 && cy>zr.top-8 && cy<zr.bottom+8;
  activeZone.style.opacity = hit ? '1' : '.55';
  activeZone.style.borderColor = hit ? 'var(--green,#2da44e)' : 'var(--orange)';
}
function itemEnd(cx,cy){
  if(!activeItem) return;
  activeItem.classList.remove('dragging');
  const zr=activeZone.getBoundingClientRect();
  const hit = cx>zr.left-10 && cx<zr.right+10 && cy>zr.top-10 && cy<zr.bottom+10;
  activeZone.style.opacity=''; activeZone.style.borderColor='';

  if(hit){
    const stage=document.getElementById('csStage');
    const sr=stage.getBoundingClientRect();
    const iw=activeItem.offsetWidth, ih=activeItem.offsetHeight;
    const snapX = zr.left - sr.left + (zr.width-iw)/2;
    const snapY = zr.top - sr.top + (zr.height-ih)/2;
    activeItem.style.left=snapX+'px'; activeItem.style.top=snapY+'px';

    if(activeTask.placeAction === 'remove'){
      // Biến mất — dành cho vứt rác, dọn đồ thừa
      const itemEl = activeItem; // chụp lại tham chiếu DOM cục bộ — activeItem sẽ bị gán null trước khi setTimeout chạy
      itemEl.classList.add('placed');
      spawnSparkle({getBoundingClientRect:()=>({left:snapX+sr.left,top:snapY+sr.top,width:iw,height:ih})});
      setTimeout(()=>{ itemEl.style.transition='opacity .3s ease, transform .3s ease'; itemEl.style.opacity='0'; itemEl.style.transform='scale(.4)'; }, 80);
    } else {
      // Giữ nguyên tại chỗ — dành cho cất đồ, kéo ghế...
      activeItem.classList.add('placed');
      const badge=document.createElement('div'); badge.className='placed-badge'; badge.textContent='✓';
      activeItem.appendChild(badge);
      spawnSparkle({getBoundingClientRect:()=>({left:snapX+sr.left,top:snapY+sr.top,width:iw,height:ih})});
    }
    showCsToast(activeTask.noiquy);
    markTaskDone();
  } else {
    activeItem.style.left=itemHome.left; activeItem.style.top=itemHome.top; activeItem.style.transform=itemHome.transform;
    G.misses++;
  }
  activeItem=null; activeZone=null; activeTask=null;
}
window.addEventListener('mousemove', e=>itemMove(e.clientX,e.clientY));
window.addEventListener('mouseup', e=>itemEnd(e.clientX,e.clientY));
window.addEventListener('touchmove', e=>{ if(!activeItem) return; const t=e.touches[0]; itemMove(t.clientX,t.clientY); }, {passive:true});
window.addEventListener('touchend', e=>{ if(!activeItem) return; const t=e.changedTouches[0]; itemEnd(t.clientX,t.clientY); });

// ── SHARED HELPERS ──────────────────────────────────────────
function ensureTimerStarted(){
  if(G.started) return;
  G.started = true;
  G.interval = setInterval(()=>{
    G.timer++;
    const el=document.getElementById('csTimer');
    if(el) el.textContent = formatTime(G.timer);
  }, 1000);
}
function spawnSparkle(refEl){
  const stage=document.getElementById('csStage');
  const sr=stage.getBoundingClientRect();
  const rr = refEl.getBoundingClientRect();
  const s=document.createElement('div'); s.className='cs-sparkle'; s.textContent='✨';
  s.style.left=(rr.left-sr.left)+'px'; s.style.top=(rr.top-sr.top)+'px';
  stage.appendChild(s);
  setTimeout(()=>s.remove(), 500);
}
let csToastTimer;
function showCsToast(text){
  const toast=document.getElementById('csToast');
  if(!toast || !text) return;
  clearTimeout(csToastTimer);
  toast.innerHTML = 'Nội quy: <b>' + escH(text) + '</b>';
  toast.classList.add('show');
  csToastTimer=setTimeout(()=>toast.classList.remove('show'), 3200);
}
function markTaskDone(){
  G.doneCount++;
  G.stageDoneCount++;
  const doneEl=document.getElementById('csDone'); if(doneEl) doneEl.textContent=G.doneCount;
  const fill=document.getElementById('csProgFill'); if(fill) fill.style.width=(G.doneCount/G.totalTasks*100)+'%';
  const lbl=document.getElementById('csProgLbl'); if(lbl) lbl.textContent=`${G.doneCount} / ${G.totalTasks} nhiệm vụ`;

  if(G.stageDoneCount >= G.tasks.length){
    if(G.stageIdx < G.stages.length - 1){
      setTimeout(()=>goToNextStage(), 700);
    } else {
      setTimeout(()=>endGame(), 700);
    }
  }
}

function goToNextStage(){
  const trans = document.getElementById('csStageTransition');
  const nextNum = G.stageIdx + 2;
  if(trans){
    trans.innerHTML = `<div class="cs-stage-trans-inner">🎉 Hoàn thành Màn ${G.stageIdx+1}!<br><span>Chuyển sang Màn ${nextNum}...</span></div>`;
    trans.classList.add('show');
  }
  setTimeout(()=>{
    if(trans) trans.classList.remove('show');
    loadStage(G.stageIdx + 1);
  }, 1400);
}

function endGame(){
  G.done = true;
  clearInterval(G.interval);
  document.getElementById('rTime').textContent = formatTime(G.timer);
  document.getElementById('rSub').textContent = `${G.tasks.length} nhiệm vụ hoàn thành`;
  document.getElementById('rDetails').innerHTML = `
    <div class="result-row"><span>⏱ Thời gian</span><span class="result-val">${formatTime(G.timer)}</span></div>
    <div class="result-row"><span>🧹 Nhiệm vụ</span><span class="result-val">${G.tasks.length} / ${G.tasks.length}</span></div>
    <div class="result-row"><span>❌ Lần thả sai</span><span class="result-val">${G.misses}</span></div>
    <div class="result-row"><span>👤 Người chơi</span><span class="result-val">${escH(playerName)}</span></div>`;
  document.getElementById('rSaveBtn').textContent = 'Lưu điểm';
  showModal('rModal');
}

// ── SUBMIT SCORE ────────────────────────────────────────────
async function submitScore(){
  const btn = document.getElementById('rSaveBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  try{
    await fetch(`${_cfg}?action=addScore&key=${_key}&name=${encodeURIComponent(playerName)}&dept=${encodeURIComponent(playerDept||'')}&game=CleanSpace&title=${encodeURIComponent(G.ch.title)}&time=${G.timer}&challengeId=${G.ch.id}&errors=${G.misses}&timestamp=${encodeURIComponent(new Date().toISOString())}`);
    playedChallenges[G.ch.id] = {time: G.timer};
    localStorage.setItem('bb_clean_played', JSON.stringify(playedChallenges));
    showToast('✅ Điểm đã lưu!','ok');
  }catch(e){ showToast('❌ Lỗi kết nối','bad'); }
  btn.textContent = 'Đã lưu ✓';
  setTimeout(()=>hideModal('rModal'), 1000);
}

function backToList(){
  if(G.interval) clearInterval(G.interval);
  G = {};
  document.getElementById('gameView').style.display='none';
  document.getElementById('listView').style.display='block';
  fetchChallenges();
}

// ── LEADERBOARD ─────────────────────────────────────────────
async function loadLB(){
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t3)">Đang tải...</div>';
  try{
    const res = await fetch(`${_cfg}?action=getScores&key=${_key}&challengeId=all&_=${Date.now()}`);
    const data = await res.json();
    _allScores = (data.scores||[]).filter(s => s.game==='CleanSpace');
    document.getElementById('lbTotal').textContent = _allScores.length;
    document.getElementById('lbPlayers').textContent = new Set(_allScores.map(s=>s.name)).size;
    _allGroups = {};
    _allScores.forEach(s=>{
      const cid = String(s.challengeId||'?');
      if(!_allGroups[cid]) _allGroups[cid]=[];
      _allGroups[cid].push(s);
    });
    const sel = document.getElementById('lbFilter');
    while(sel.options.length>1) sel.remove(1);
    Object.keys(_allGroups).sort((a,b)=>+b-+a).forEach(cid=>{
      const ch = challenges.find(c=>String(c.id)===cid);
      const opt = document.createElement('option');
      opt.value=cid; opt.textContent=ch?.title||`Ván #${cid}`;
      sel.appendChild(opt);
    });
    renderLB();
  }catch(e){
    content.innerHTML=`<div style="text-align:center;padding:40px;color:var(--t3)">❌ ${e.message}</div>`;
  }
}

function renderLB(){
  const content = document.getElementById('lbContent');
  if(!_allScores.length){
    content.innerHTML='<div style="text-align:center;padding:48px;color:var(--t3)">🚀 Chưa có ai hoàn thành!</div>';
    return;
  }
  const filter = document.getElementById('lbFilter')?.value||'all';
  const ri = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':`<span style="font-family:var(--mono);color:var(--t3)">#${i+1}</span>`;

  const renderTable = rows => {
    const sorted = [...rows].sort((a,b)=>(+a.time||0)-(+b.time||0));
    return `<table style="width:100%;border-collapse:collapse">
      <thead><tr>
        ${['Hạng','Tên','Phòng ban','Thời gian','Lần thả sai'].map(h=>`<th style="text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1.5px solid var(--border);font-weight:700">${h}</th>`).join('')}
      </tr></thead>
      <tbody>${sorted.map((s,i)=>`<tr style="background:${s.name===playerName?'var(--ol)':''}">
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2)">${ri(i)}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);font-weight:700;color:${s.name===playerName?'var(--orange)':'var(--text)'}">
          ${escH(s.name)}${s.name===playerName?'<span style="font-size:10px;background:var(--ol);color:var(--orange);border:1px solid var(--om);border-radius:999px;padding:1px 6px;margin-left:4px">bạn</span>':''}
        </td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);color:var(--t2);font-size:13px">${escH(s.dept||'—')}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);font-family:var(--mono);color:var(--orange);font-weight:700;font-size:15px">${formatTime(+s.time)}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);color:var(--t2);font-weight:600">${s.errors||'0'}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  };

  if(filter==='all'){
    const cids = Object.keys(_allGroups).sort((a,b)=>+b-+a);
    content.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:16px">
      ${cids.map(cid=>{
        const ch=challenges.find(c=>String(c.id)===cid);
        const title=ch?.title||_allGroups[cid][0]?.title||`Ván #${cid}`;
        return `<div style="flex:1;min-width:320px;background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)">
          <div style="font-size:15px;font-weight:800;margin-bottom:14px">${escH(title)}</div>
          ${renderTable(_allGroups[cid])}
        </div>`;
      }).join('')}
    </div>`;
  }else{
    const rows = _allGroups[filter]||[];
    content.innerHTML=`<div class="card">${renderTable(rows)}</div>`;
  }
}

// ── HELPERS ─────────────────────────────────────────────────
function formatTime(s){ return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function escH(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
