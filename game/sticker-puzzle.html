<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Puzzle — OhM!nd Lab</title>
<link rel="icon" type="image/png" href="../pic/Favicon1.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
/* ── STICKER PUZZLE SPECIFIC ──────────────────────────────────── */

.stk-layout{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;}

.stk-board-wrap{flex:0 0 auto;width:min(380px,100%);margin:0 auto;}
.stk-board-sq{width:100%;aspect-ratio:1/1;}
.stk-board{display:grid;width:100%;height:100%;gap:3px;background:var(--border);border:2px solid var(--text);border-radius:10px;overflow:hidden;}
.stk-slot{position:relative;background:
  repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 6px,var(--bg) 6px,var(--bg) 12px);
  display:flex;align-items:center;justify-content:center;}
.stk-slot.filled{background:none;}
.stk-slot.correct{box-shadow:inset 0 0 0 3px var(--green);}
.stk-slot.dragover{box-shadow:inset 0 0 0 3px var(--orange);}

.stk-tray-wrap{flex:1;min-width:230px;}
.stk-tray-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:8px;}
.stk-tray{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--bg2);border:1.5px dashed var(--border);border-radius:12px;min-height:90px;align-content:flex-start;}
.stk-tray.dragover{border-color:var(--orange);background:var(--ol);}
.stk-tray-empty{font-size:12px;color:var(--t3);padding:10px;width:100%;text-align:center;}

.stk-piece{background-repeat:no-repeat;border-radius:5px;cursor:grab;touch-action:none;
  box-shadow:0 1px 3px rgba(0,0,0,.18);border:1.5px solid rgba(255,255,255,.6);flex:0 0 auto;}
.stk-piece:active{cursor:grabbing;}
.stk-piece.selected{outline:3px solid var(--orange);outline-offset:1px;}
.stk-piece.hidden-orig{visibility:hidden;}
.stk-piece.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;
  transform:scale(1.1) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.32);border-radius:5px;}

@media(max-width:640px){
  .stk-layout{flex-direction:column;}
  .stk-board-wrap{width:min(320px,100%);}
}
</style>
</head>
<body>
<div id="app">

<!-- RESULT MODAL -->
<div class="overlay hidden" id="rModal">
  <div class="modal" style="text-align:center">
    <div class="modal-icon">🧩</div>
    <h2>Hoàn thành!</h2>
    <p>Bạn đã ghép đúng toàn bộ bức tranh.</p>
    <div id="rDetails" style="margin-bottom:20px;text-align:left"></div>
    <div style="display:flex;gap:9px;justify-content:center">
      <button class="btn btn-primary" id="rSaveBtn" onclick="submitScore()">Lưu điểm</button>
      <button class="btn btn-secondary" onclick="hideModal('rModal')">Đóng</button>
    </div>
  </div>
</div>

<header>
  <div class="logo">
    <img src="../pic/OhM!nd Lab.png" style="height:80px;object-fit:contain">
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="../index.html" class="btn btn-secondary btn-sm">← Trang chủ</a>
    <div class="player-chip" id="playerChip" onclick="changePlayer()" style="display:none">
      <div class="chip-av" id="chipAv">?</div>
      <span id="hName">Khách</span>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('play',this)">🧩 Chơi ngay</button>
  <button class="tab" onclick="switchTab('lb',this);loadLB()">🏆 Xếp hạng</button>
</div>

<div class="main">

  <!-- PLAY PAGE -->
  <div id="page-play" class="page active">
    <div id="listView">
      <div class="card-label" style="margin-bottom:14px">Chọn thử thách để bắt đầu</div>
      <div id="challengeList"><div style="text-align:center;padding:48px;color:var(--t3)">⏳ Đang tải...</div></div>
    </div>
    <div id="gameView" style="display:none">
      <div class="game-header">
        <button class="back-btn" onclick="backToList()">← Danh sách</button>
        <div>
          <div class="game-title" id="gameTitle">Sticker Puzzle</div>
          <div class="game-subtitle" id="gameSubtitle"></div>
        </div>
      </div>
      <div id="gameArea"></div>
    </div>
  </div>

  <!-- LEADERBOARD PAGE -->
  <div id="page-lb" class="page">
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:130px;margin-bottom:0;text-align:center;padding:16px">
        <div style="font-family:var(--mono);font-size:26px;font-weight:500;color:var(--orange)" id="lbTotal">—</div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px">Tổng lượt chơi</div>
      </div>
      <div class="card" style="flex:1;min-width:130px;margin-bottom:0;text-align:center;padding:16px">
        <div style="font-family:var(--mono);font-size:26px;font-weight:500;color:var(--orange)" id="lbPlayers">—</div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px">Số người chơi</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3)">Chọn ván:</div>
        <select id="lbFilter" onchange="renderLB()" style="flex:1;min-width:200px;max-width:400px;background:var(--bg);border:1.5px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;font-family:var(--sans);font-size:13px;font-weight:600">
          <option value="all">Tất cả ván</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadLB()">🔄 Refresh</button>
      </div>
    </div>
    <div id="lbContent"><div style="text-align:center;padding:40px;color:var(--t3)">Đang tải...</div></div>
  </div>

</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const _cfg = 'https://script.google.com/macros/s/AKfycby2iK5X78FucVv36FcgyKPJiEopb9gdQMpD6V11QWAnMYpNo09yetHe11V3TtNjvbwG/exec';
const _key = 'BTK2026';

// ── STATE ───────────────────────────────────────────────────
let playerName = localStorage.getItem('bb_name') || '';
let playerDept = localStorage.getItem('bb_dept') || '';
let challenges = [];
let playedChallenges = JSON.parse(localStorage.getItem('bb_stk_played') || '{}');
let G = {};
let _allScores = [], _allGroups = {};

const DIFF_LABEL = { easy:'😊 Dễ', medium:'🤔 Vừa', hard:'😤 Khó' };

// ── BOOT ────────────────────────────────────────────────────
window.onload = () => {
  if(!playerName){ window.location.href='../index.html'; return; }
  updateHeader();
  fetchChallenges();
};
window.addEventListener('resize', () => { if(G.ch) syncPieceSize(); });

// ── PLAYER ──────────────────────────────────────────────────
function showModal(id){ document.getElementById(id).classList.remove('hidden'); }
function hideModal(id){ document.getElementById(id).classList.add('hidden'); }
function changePlayer(){ window.location.href = '../index.html'; }
function updateHeader(){
  document.getElementById('hName').textContent = playerName||'Khách';
  document.getElementById('chipAv').textContent = (playerName||'?')[0].toUpperCase();
  document.getElementById('playerChip').style.display = 'flex';
}

// ── TABS ────────────────────────────────────────────────────
function switchTab(name, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='play') backToList();
}

// ── FETCH CHALLENGES ────────────────────────────────────────
async function fetchChallenges(){
  try{
    const res = await fetch(`${_cfg}?action=getActiveChallenges&key=${_key}&_=${Date.now()}`);
    const data = await res.json();
    challenges = (data.challenges||[]).filter(c => c.type === 'sticker-puzzle');
    renderChallengeList();
  }catch(e){
    document.getElementById('challengeList').innerHTML=`<div class="no-challenges"><div class="icon">⚠️</div><h3>Không thể tải</h3><p>${e.message}</p></div>`;
  }
}

function renderChallengeList(){
  const list = document.getElementById('challengeList');
  const now = Date.now();
  const active = challenges.filter(c => new Date(c.deadline) > now);
  if(!active.length){
    list.innerHTML=`<div class="no-challenges"><div class="icon">🧩</div><h3>Chưa có thử thách nào</h3><p>Admin sẽ tạo thử thách mới sớm thôi!</p></div>`;
    return;
  }
  list.innerHTML='';
  const grid = document.createElement('div'); grid.className='ch-grid';
  active.forEach(ch => {
    const played = playedChallenges[ch.id];
    const n = ch.gridSize||4;
    const card = document.createElement('div');
    card.className='ch-card'+(played?' played':'');
    card.innerHTML=`
      <div class="ch-card-top">
        <span class="ch-diff diff-${ch.difficulty||'medium'}">${DIFF_LABEL[ch.difficulty]||'🧩 Puzzle'}</span>
      </div>
      <div class="ch-title">${escH(ch.title)}</div>
      <div class="ch-desc">${escH(ch.description||`Ghép ${n*n} mảnh thành 1 bức tranh hoàn chỉnh!`)}</div>
      <div class="ch-meta">
        <span class="ch-meta-item">🧩 ${n}×${n} · ${n*n} mảnh</span>
        <span class="ch-meta-item">⏰ <span class="ch-countdown" id="cd-${ch.id}"></span></span>
      </div>
      ${played?`<div class="ch-played-badge">✅ Đã chơi — ${formatTime(played.time)}</div>`:''}`;
    card.onclick = () => startGame(ch);
    grid.appendChild(card);
    startCardCountdown(ch.id, new Date(ch.deadline));
  });
  list.appendChild(grid);
}

function startCardCountdown(id, deadline){
  const update = () => {
    const el = document.getElementById('cd-'+id); if(!el) return;
    const diff = deadline - Date.now();
    if(diff<=0){ el.textContent='Hết hạn'; return; }
    const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.className='ch-countdown'+(diff<3600000?' urgent':'');
  };
  update(); setInterval(update,1000);
}

// ══════════════════════════════════════════════════════════════
//  GAME ENGINE
// ══════════════════════════════════════════════════════════════
function startGame(ch){
  document.getElementById('listView').style.display='none';
  document.getElementById('gameView').style.display='block';
  document.getElementById('gameTitle').textContent = ch.title;
  const n = ch.gridSize||4;
  document.getElementById('gameSubtitle').textContent = `Ghép ${n*n} mảnh · ${DIFF_LABEL[ch.difficulty]||''}`;

  const n2 = n*n;
  const pieces = [];
  for(let i=0;i<n2;i++){
    const row = Math.floor(i/n), col = i%n;
    pieces.push({
      id: i,
      correctIndex: i,
      bgX: n>1 ? (col/(n-1))*100 : 0,
      bgY: n>1 ? (row/(n-1))*100 : 0
    });
  }
  const trayOrder = shuffle(pieces.map(p=>p.id));

  G = {
    ch, n, pieces,
    slots: new Array(n2).fill(null),
    trayOrder,
    moves: 0,
    started: false,
    timer: 0,
    interval: null,
    done: false,
    selected: null // {type:'tray'|'slot', id/idx}
  };

  renderGame();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  // đảm bảo không vô tình xáo ra đúng thứ tự ban đầu
  if(a.every((v,i)=>v===i)) { [a[0],a[1]]=[a[1],a[0]]; }
  return a;
}

function renderGame(){
  const ch = G.ch;
  const played = playedChallenges[ch.id];

  document.getElementById('gameArea').innerHTML = `
    ${played?`<div class="already-played">✅ Đã hoàn thành với <strong>${formatTime(played.time)}</strong>. Chơi lại không tính điểm.</div>`:''}
    <div class="timer-bar">
      <div class="game-timer" id="stkTimer">${formatTime(0)}</div>
      <div class="stats-row">
        <span class="stat-chip">🎯 <span id="stkFound">0</span> / ${G.n*G.n}</span>
        <span class="stat-chip">🔀 <span id="stkMoves">0</span> lượt di chuyển</span>
      </div>
    </div>
    <div class="stk-layout">
      <div class="stk-board-wrap">
        <div class="stk-board-sq">
          <div class="stk-board" id="stkBoard" style="grid-template-columns:repeat(${G.n},1fr);grid-template-rows:repeat(${G.n},1fr)"></div>
        </div>
      </div>
      <div class="stk-tray-wrap">
        <div class="stk-tray-label">Kho mảnh ghép — kéo hoặc chạm để chọn, rồi thả vào ô đích</div>
        <div class="stk-tray" id="stkTray"></div>
      </div>
    </div>
    <div class="tips-box">💡 <strong>Kéo thả</strong> mảnh ghép vào đúng ô trên bức tranh. Hoặc <strong>chạm 1 lần</strong> để chọn mảnh, rồi chạm ô đích để đặt vào — tiện cho màn hình cảm ứng.</div>`;

  buildBoardSlots();
  syncTray();
  syncPieceSize();
}

function buildBoardSlots(){
  const board = document.getElementById('stkBoard');
  board.innerHTML='';
  for(let i=0;i<G.n*G.n;i++){
    const slot = document.createElement('div');
    slot.className='stk-slot';
    slot.dataset.slot = i;
    board.appendChild(slot);
  }
  attachDnD(board);
  attachDnD(document.getElementById('stkTray'));
  renderSlots();
}

function pieceStyle(p){
  const url = toDriveImg(G.ch.image);
  return `background-image:url('${url}');background-size:${G.n*100}% ${G.n*100}%;background-position:${p.bgX}% ${p.bgY}%;`;
}

function makePieceEl(pieceId){
  const p = G.pieces[pieceId];
  const el = document.createElement('div');
  el.className='stk-piece';
  el.dataset.pieceId = pieceId;
  el.style.cssText = pieceStyle(p);
  return el;
}

function renderSlots(){
  const board = document.getElementById('stkBoard');
  [...board.children].forEach((slotEl,i)=>{
    slotEl.innerHTML='';
    slotEl.classList.remove('filled','correct');
    const pid = G.slots[i];
    if(pid!==null){
      const pieceEl = makePieceEl(pid);
      pieceEl.style.width='100%'; pieceEl.style.height='100%'; pieceEl.style.borderRadius='0';
      if(G.selected && G.selected.pieceId===pid) pieceEl.classList.add('selected');
      slotEl.appendChild(pieceEl);
      slotEl.classList.add('filled');
      if(G.pieces[pid].correctIndex===i) slotEl.classList.add('correct');
    }
  });
  syncPieceSize();
}

function syncTray(){
  const tray = document.getElementById('stkTray');
  tray.innerHTML='';
  if(!G.trayOrder.length){
    tray.innerHTML = '<div class="stk-tray-empty">Kho trống — tất cả mảnh đã lên bàn cờ</div>';
    return;
  }
  G.trayOrder.forEach(pid=>{
    const el = makePieceEl(pid);
    if(G.selected && G.selected.type==='tray' && G.selected.pieceId===pid) el.classList.add('selected');
    tray.appendChild(el);
  });
  syncPieceSize();
}

function syncPieceSize(){
  const board = document.getElementById('stkBoard');
  if(!board || !board.firstChild) return;
  const size = board.firstChild.getBoundingClientRect().width;
  if(!size) return;
  document.querySelectorAll('#stkTray .stk-piece').forEach(el=>{
    el.style.width = size+'px'; el.style.height = size+'px';
  });
}

// ── Chọn bằng chạm (tap-to-place, dự phòng cho cảm ứng) ──────
function onPieceTap(pieceId, from){
  if(G.done) return;
  if(G.selected && G.selected.pieceId===pieceId){
    G.selected = null; // bỏ chọn
  }else{
    G.selected = { pieceId, from };
  }
  renderSlots(); syncTray();
}

function onSlotTap(slotIdx){
  if(G.done || !G.selected) return;
  movePiece(G.selected.pieceId, G.selected.from, {type:'slot', slotIdx});
  G.selected = null;
}

// ── Kéo thả (Pointer Events — hỗ trợ cả chuột & cảm ứng) ─────
function attachDnD(container){
  container.addEventListener('pointerdown', onPointerDown);
}

let _drag = null;

function onPointerDown(e){
  if(G.done) return;
  const slotEl = e.target.closest('.stk-slot');
  const trayEl = e.target.closest('.stk-tray');
  const pieceEl = e.target.closest('.stk-piece');

  // Nếu đang có 1 mảnh được chọn sẵn (chế độ chạm-chọn), ưu tiên xử lý đặt mảnh
  if(G.selected){
    const targetPieceId = pieceEl ? +pieceEl.dataset.pieceId : null;
    if(targetPieceId === G.selected.pieceId){
      G.selected = null; renderSlots(); syncTray();
      return; // chạm lại đúng mảnh đang chọn → bỏ chọn
    }else if(slotEl){
      onSlotTap(+slotEl.dataset.slot);
      return;
    }else if(trayEl && G.selected.from.type==='slot'){
      movePiece(G.selected.pieceId, G.selected.from, {type:'tray'});
      G.selected = null;
      return;
    }
    // chạm 1 mảnh khác trong khay → rơi xuống bên dưới để chuyển lựa chọn sang mảnh đó
  }

  if(!pieceEl) return;
  const pieceId = +pieceEl.dataset.pieceId;
  const parentSlot = pieceEl.closest('.stk-slot');
  const from = parentSlot ? {type:'slot', slotIdx:+parentSlot.dataset.slot} : {type:'tray'};

  const rect = pieceEl.getBoundingClientRect();
  _drag = {
    pieceId, from,
    startX: e.clientX, startY: e.clientY,
    size: rect.width,
    moved: false,
    ghost: null
  };
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp, {once:true});
}

function onPointerMove(e){
  if(!_drag) return;
  const dx = e.clientX-_drag.startX, dy = e.clientY-_drag.startY;
  if(!_drag.moved && Math.hypot(dx,dy) > 6){
    _drag.moved = true;
    const p = G.pieces[_drag.pieceId];
    const ghost = document.createElement('div');
    ghost.className = 'stk-piece ghost';
    ghost.style.cssText = pieceStyle(p) + `width:${_drag.size}px;height:${_drag.size}px;`;
    document.body.appendChild(ghost);
    _drag.ghost = ghost;
    G.selected = null; renderSlots(); syncTray();
  }
  if(_drag.moved && _drag.ghost){
    _drag.ghost.style.left = (e.clientX - _drag.size/2)+'px';
    _drag.ghost.style.top = (e.clientY - _drag.size/2)+'px';
    document.querySelectorAll('.dragover').forEach(el=>el.classList.remove('dragover'));
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest('.stk-slot');
    const tray = under && under.closest('.stk-tray');
    if(slot) slot.classList.add('dragover');
    else if(tray) tray.classList.add('dragover');
  }
}

function onPointerUp(e){
  window.removeEventListener('pointermove', onPointerMove);
  if(!_drag) return;
  document.querySelectorAll('.dragover').forEach(el=>el.classList.remove('dragover'));
  if(_drag.ghost) _drag.ghost.remove();

  if(!_drag.moved){
    // Coi như 1 cú chạm/click đơn giản → dùng cơ chế chọn
    onPieceTap(_drag.pieceId, _drag.from);
    _drag = null;
    return;
  }

  const under = document.elementFromPoint(e.clientX, e.clientY);
  const slotEl = under && under.closest('.stk-slot');
  const trayEl = under && under.closest('.stk-tray');

  if(slotEl){
    movePiece(_drag.pieceId, _drag.from, {type:'slot', slotIdx:+slotEl.dataset.slot});
  }else if(trayEl && _drag.from.type==='slot'){
    movePiece(_drag.pieceId, _drag.from, {type:'tray'});
  }
  _drag = null;
}

// ── Cập nhật dữ liệu khi di chuyển 1 mảnh ────────────────────
function movePiece(pieceId, from, to){
  if(!G.started){
    G.started = true;
    G.interval = setInterval(()=>{
      G.timer++;
      const el = document.getElementById('stkTimer');
      if(el) el.textContent = formatTime(G.timer);
    }, 1000);
  }

  if(to.type==='slot' && from.type==='slot' && from.slotIdx===to.slotIdx){
    renderSlots(); syncTray(); return; // thả lại đúng chỗ cũ — không tính lượt
  }
  if(to.type==='tray' && from.type==='tray'){
    renderSlots(); syncTray(); return;
  }

  let bumped = null; // mảnh bị đẩy ra nếu ô đích đã có người

  if(to.type==='slot'){
    bumped = G.slots[to.slotIdx];
    G.slots[to.slotIdx] = pieceId;
  }

  if(from.type==='slot'){
    if(to.type==='slot'){
      G.slots[from.slotIdx] = bumped; // hoán đổi (bumped có thể null)
    }else{
      G.slots[from.slotIdx] = null;
    }
  }else{ // from tray
    G.trayOrder = G.trayOrder.filter(id=>id!==pieceId);
    if(to.type==='slot' && bumped!==null){
      G.trayOrder.push(bumped); // mảnh bị đẩy quay về kho
    }
  }
  if(to.type==='tray'){
    G.trayOrder.push(pieceId);
  }

  G.moves++;
  document.getElementById('stkMoves').textContent = G.moves;
  renderSlots(); syncTray();

  const foundCount = G.slots.filter((pid,i)=> pid!==null && G.pieces[pid].correctIndex===i).length;
  document.getElementById('stkFound').textContent = foundCount;

  if(foundCount === G.n*G.n){
    setTimeout(()=>endGame(), 250);
  }
}

function endGame(){
  G.done = true;
  clearInterval(G.interval);
  document.getElementById('rDetails').innerHTML = `
    <div class="result-row"><span>⏱ Thời gian</span><span class="result-val">${formatTime(G.timer)}</span></div>
    <div class="result-row"><span>🔀 Số lượt di chuyển</span><span class="result-val">${G.moves}</span></div>
    <div class="result-row"><span>🧩 Số mảnh</span><span class="result-val">${G.n*G.n}</span></div>
    <div class="result-row"><span>👤 Người chơi</span><span class="result-val">${escH(playerName)}</span></div>`;
  document.getElementById('rSaveBtn').textContent = 'Lưu điểm';
  showModal('rModal');
}

// ── SUBMIT SCORE ────────────────────────────────────────────
async function submitScore(){
  const btn = document.getElementById('rSaveBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  try{
    await fetch(`${_cfg}?action=addScore&key=${_key}&name=${encodeURIComponent(playerName)}&dept=${encodeURIComponent(playerDept||'')}&game=StickerPuzzle&title=${encodeURIComponent(G.ch.title)}&time=${G.timer}&moves=${G.moves}&challengeId=${G.ch.id}&timestamp=${encodeURIComponent(new Date().toISOString())}`);
    playedChallenges[G.ch.id] = {time: G.timer};
    localStorage.setItem('bb_stk_played', JSON.stringify(playedChallenges));
    showToast('✅ Điểm đã lưu!','ok');
  }catch(e){ showToast('❌ Lỗi kết nối','bad'); }
  btn.textContent = 'Đã lưu ✓';
  setTimeout(()=>hideModal('rModal'), 1000);
}

function backToList(){
  if(G.interval) clearInterval(G.interval);
  G = {};
  document.getElementById('gameView').style.display='none';
  document.getElementById('listView').style.display='block';
  fetchChallenges();
}

// ── LEADERBOARD ─────────────────────────────────────────────
async function loadLB(){
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t3)">Đang tải...</div>';
  try{
    const res = await fetch(`${_cfg}?action=getScores&key=${_key}&challengeId=all&_=${Date.now()}`);
    const data = await res.json();
    _allScores = (data.scores||[]).filter(s => s.game==='StickerPuzzle');
    document.getElementById('lbTotal').textContent = _allScores.length;
    document.getElementById('lbPlayers').textContent = new Set(_allScores.map(s=>s.name)).size;
    _allGroups = {};
    _allScores.forEach(s=>{
      const cid = String(s.challengeId||'?');
      if(!_allGroups[cid]) _allGroups[cid]=[];
      _allGroups[cid].push(s);
    });
    const sel = document.getElementById('lbFilter');
    while(sel.options.length>1) sel.remove(1);
    Object.keys(_allGroups).sort((a,b)=>+b-+a).forEach(cid=>{
      const ch = challenges.find(c=>String(c.id)===cid);
      const opt = document.createElement('option');
      opt.value=cid; opt.textContent=ch?.title||`Ván #${cid}`;
      sel.appendChild(opt);
    });
    renderLB();
  }catch(e){
    content.innerHTML=`<div style="text-align:center;padding:40px;color:var(--t3)">❌ ${e.message}</div>`;
  }
}

function renderLB(){
  const content = document.getElementById('lbContent');
  if(!_allScores.length){
    content.innerHTML='<div style="text-align:center;padding:48px;color:var(--t3)">🚀 Chưa có ai hoàn thành!</div>';
    return;
  }
  const filter = document.getElementById('lbFilter')?.value||'all';
  const ri = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':`<span style="font-family:var(--mono);color:var(--t3)">#${i+1}</span>`;

  const renderTable = rows => {
    const sorted = [...rows].sort((a,b)=>((+a.time||0)-(+b.time||0)) || ((+a.moves||0)-(+b.moves||0)));
    return `<table style="width:100%;border-collapse:collapse">
      <thead><tr>
        ${['Hạng','Tên','Phòng ban','Thời gian','Lượt di chuyển'].map(h=>`<th style="text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);border-bottom:1.5px solid var(--border);font-weight:700">${h}</th>`).join('')}
      </tr></thead>
      <tbody>${sorted.map((s,i)=>`<tr style="background:${s.name===playerName?'var(--ol)':''}">
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2)">${ri(i)}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);font-weight:700;color:${s.name===playerName?'var(--orange)':'var(--text)'}">
          ${escH(s.name)}${s.name===playerName?'<span style="font-size:10px;background:var(--ol);color:var(--orange);border:1px solid var(--om);border-radius:999px;padding:1px 6px;margin-left:4px">bạn</span>':''}
        </td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);color:var(--t2);font-size:13px">${escH(s.dept||'—')}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);font-family:var(--mono);color:var(--orange);font-weight:700;font-size:15px">${formatTime(+s.time)}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--bg2);color:var(--t2);font-weight:600">${s.moves||0}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  };

  if(filter==='all'){
    const cids = Object.keys(_allGroups).sort((a,b)=>+b-+a);
    content.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:16px">
      ${cids.map(cid=>{
        const ch=challenges.find(c=>String(c.id)===cid);
        const title=ch?.title||_allGroups[cid][0]?.title||`Ván #${cid}`;
        return `<div style="flex:1;min-width:320px;background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)">
          <div style="font-size:15px;font-weight:800;margin-bottom:14px">${escH(title)}</div>
          ${renderTable(_allGroups[cid])}
        </div>`;
      }).join('')}
    </div>`;
  }else{
    const rows = _allGroups[filter]||[];
    content.innerHTML=`<div class="card">${renderTable(rows)}</div>`;
  }
}

// ── HELPERS ─────────────────────────────────────────────────
function toDriveImg(url){
  if(!url) return url;
  url = String(url).trim();
  if(/lh3\.googleusercontent\.com|drive\.google\.com\/thumbnail/.test(url)) return url;
  if(!/drive\.google\.com/.test(url)) return url;
  let id = null;
  let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) id = m[1];
  if(!id){ m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) id = m[1]; }
  if(!id) return url;
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
}

function formatTime(s){ s=Math.max(0,s|0); return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function escH(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
